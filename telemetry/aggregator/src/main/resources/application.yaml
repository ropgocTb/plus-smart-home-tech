aggregator:
  kafka:
    bootstrap-servers: "localhost:9092"
    producer:
      properties:
        "bootstrap.servers": ${aggregator.kafka.bootstrap-servers}
        "key.serializer": "org.apache.kafka.common.serialization.StringSerializer"
        "value.serializer": "ru.yandex.practicum.kafka.serializer.GeneralAvroSerializer"
      topic: "telemetry.snapshots.v1"

    consumer:
      properties:
        "bootstrap.servers": ${aggregator.kafka.bootstrap-servers}
        "enable.auto.commit": false
        "group.id": "sensorEvent.group.id"
        "client.id": "SensorEventConsumer"
        "key.deserializer": "org.apache.kafka.common.serialization.StringDeserializer"
        "value.deserializer": "ru.yandex.practicum.kafka.deserializer.SensorEventDeserializer"
        "auto.offset.reset": "earliest"
      topic: "telemetry.sensors.v1"
      poll-timeout: 100ms

spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false